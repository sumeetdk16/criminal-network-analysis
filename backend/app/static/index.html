<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criminal Network Analysis System</title>
<style>
/* ===================================================================
   Design tokens.

   Colours come from a validated palette rather than taste. The
   categorical slots, the ordinal ramp and the status roles were each
   run through a colour-vision-deficiency validator against the exact
   surfaces below - the three-slot categorical set clears the all-pairs
   floors in both modes, and the ordinal ramp is monotone in lightness
   with visible step gaps. Node types in the graph additionally carry
   SHAPE, so identity never rests on hue alone.
   =================================================================== */
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --hover:rgba(11,11,11,.04);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --o1:#86b6ef; --o2:#3987e5; --o3:#256abf; --o4:#104281;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --accent:#2a78d6; --accent-wash:rgba(42,120,214,.10);
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 8px 24px rgba(11,11,11,.06);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --hover:rgba(255,255,255,.05);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --o1:#b7d3f6; --o2:#6da7ec; --o3:#2a78d6; --o4:#184f95;
  --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.55 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--accent)}
::selection{background:var(--accent-wash)}

/* ------------------------------------------------------------ shell */
#app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
.notice{
  padding:5px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);
  font-size:11px;color:var(--muted);text-align:center;letter-spacing:.01em;
}
header{
  display:flex;align-items:center;gap:14px;padding:11px 18px;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{
  width:26px;height:26px;border-radius:7px;flex:0 0 auto;
  background:var(--accent);display:grid;place-items:center;
}
.brand .mark svg{width:15px;height:15px}
.brand .t{font-weight:640;letter-spacing:-.012em;line-height:1.2;white-space:nowrap}
.brand .s{font-size:11px;color:var(--muted);line-height:1.2}

nav{display:flex;gap:1px;margin-left:6px}
nav button{
  padding:6px 12px;border-radius:8px;color:var(--ink-2);font-size:13px;
  display:flex;align-items:center;gap:7px;white-space:nowrap;
}
nav button:hover{background:var(--hover);color:var(--ink)}
nav button.on{background:var(--accent-wash);color:var(--accent);font-weight:560}
nav button kbd{font-size:9.5px;opacity:.55;font-family:var(--mono)}
.spacer{flex:1}

.chip{
  font-size:11.5px;padding:5px 10px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--ink-2);white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.chip b{color:var(--ink);font-weight:620}
.icon-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
  display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto;
}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg{width:15px;height:15px}
select.role{
  background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
  padding:6px 9px;font-size:12px;max-width:210px;
}
.kbtn{
  display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--muted);
  font-size:12px;
}
.kbtn:hover{color:var(--ink);border-color:var(--axis)}
kbd{
  font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:4px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
}

main{display:grid;overflow:hidden;min-height:0}
main.with-panels{grid-template-columns:270px 1fr 380px}
main.wide{grid-template-columns:1fr}
aside{
  background:var(--surface);overflow-y:auto;padding:16px;min-height:0;
  border-right:1px solid var(--border);
}
.side{
  background:var(--surface);overflow-y:auto;padding:16px;min-height:0;
  border-left:1px solid var(--border);border-right:none;
}
.stage{position:relative;overflow:hidden;background:var(--page);min-height:0}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.drag{cursor:grabbing}
.scroller{position:absolute;inset:0;overflow-y:auto;padding:22px 26px 40px}

h3{
  margin:0 0 9px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:640;
}
.block{margin-bottom:22px}

/* ------------------------------------------------------------- cards */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 15px;
}
.card+.card{margin-top:10px}
.card h4{margin:0 0 5px;font-size:13px;font-weight:620;line-height:1.35}
.card p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.card.clk{cursor:pointer;transition:border-color .12s,background .12s}
.card.clk:hover{border-color:var(--accent);background:var(--hover)}

/* --------------------------------------------------------- dashboard */
.dash{max-width:1240px;margin:0 auto}
.dash-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.dash-head h1{margin:0;font-size:21px;font-weight:640;letter-spacing:-.02em}
.dash-head p{margin:3px 0 0;font-size:13px;color:var(--ink-2);max-width:62ch}
.grid{display:grid;gap:12px;align-items:start}
.g-tiles{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:1.15fr 1fr 1fr}

.tile{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:15px 16px;
}
.tile .lbl{font-size:12px;color:var(--ink-2)}
.tile .val{
  font-size:32px;font-weight:640;letter-spacing:-.025em;line-height:1.15;margin-top:3px;
}
.tile.hero .val{font-size:44px}
.tile .hint{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}

.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:15px 16px 13px;display:flex;flex-direction:column;min-width:0;
}
.panel-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel-head h2{margin:0;font-size:13.5px;font-weight:620;letter-spacing:-.005em;flex:1;min-width:0}
.panel-head .sub{
  font-size:11.5px;color:var(--muted);flex:0 0 100%;order:3;margin-top:1px;line-height:1.4;
}
.tbtn{
  font-size:10.5px;color:var(--muted);padding:3px 7px;border-radius:6px;
  border:1px solid transparent;
}
.tbtn:hover{color:var(--ink);border-color:var(--border)}
.tbtn.on{color:var(--accent);border-color:var(--border);background:var(--accent-wash)}
.chart{margin-top:10px;position:relative}
.chart svg{display:block;width:100%;overflow:visible}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.legend i{width:14px;height:2px;border-radius:2px;display:block}
.legend i.dot{width:9px;height:9px;border-radius:50%}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--hover)}

.status-row{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.status-row .r{display:flex;align-items:center;gap:9px;font-size:13px}
.status-row .r svg{width:15px;height:15px;flex:0 0 auto}
.status-row .r .n{margin-left:auto;font-weight:620;font-variant-numeric:tabular-nums}
.status-row .r .t{color:var(--ink-2)}

.kv{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.kv .r{display:flex;gap:10px;font-size:12.5px;align-items:baseline}
.kv .r .k{color:var(--ink-2);flex:1;min-width:0}
.kv .r .v{font-weight:600;font-variant-numeric:tabular-nums}

.sev{
  display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:2px 7px;
  border-radius:5px;font-weight:640;letter-spacing:.04em;text-transform:uppercase;
}
.sev svg{width:11px;height:11px}
.sev.high{background:rgba(208,59,59,.13);color:var(--critical)}
.sev.medium{background:rgba(250,178,25,.16);color:#a06f00}
:root[data-theme="dark"] .sev.medium{color:var(--warning)}
.sev.low{background:rgba(12,163,12,.13);color:var(--good)}

.pill{
  font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);margin-right:4px;display:inline-block;
  border:1px solid var(--border);
}
.corr{display:inline-flex;gap:3px;align-items:center;margin-left:5px}
.corr i{width:5px;height:5px;border-radius:50%;background:var(--s3);display:block}

/* ------------------------------------------------------------ inputs */
.q{
  width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface-2);outline:none;
}
.q:focus{border-color:var(--accent);background:var(--surface)}
.hint{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.6}
.ex{
  display:block;width:100%;text-align:left;font-size:11.5px;color:var(--ink-2);
  padding:5px 8px;border-radius:7px;margin:2px 0;line-height:1.4;
}
.ex:hover{background:var(--hover);color:var(--accent)}
label.row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px;color:var(--ink-2);cursor:pointer}
label.row:hover{color:var(--ink)}
label.row .n{margin-left:auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn-row{display:flex;gap:6px;margin-top:8px}
.btn{
  flex:1;text-align:center;padding:6px 9px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);font-size:12px;color:var(--ink-2);
}
.btn:hover{color:var(--ink);border-color:var(--axis)}
.btn.primary{color:var(--accent);border-color:var(--accent-wash);background:var(--accent-wash)}
.btn:disabled{opacity:.55;cursor:default}
.flabel{display:block;font-size:11px;color:var(--muted);margin:11px 0 4px}
.flabel:first-child{margin-top:0}
textarea.q{width:100%;resize:vertical;font-family:inherit;line-height:1.5}
input[type=file].q{padding:7px 9px}
.dl{
  display:inline-flex;align-items:center;gap:6px;margin:9px 8px 0 0;padding:6px 11px;
  border:1px solid var(--border);border-radius:8px;background:var(--surface-2);
  color:var(--accent);font-size:12px;text-decoration:none;
}
.dl:hover{border-color:var(--accent)}

.tabs{display:flex;gap:2px;margin-bottom:13px;border-bottom:1px solid var(--border)}
.tabs button{padding:7px 11px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

.md{font-size:13px;line-height:1.65}
.md h2{font-size:15px;margin:14px 0 8px;font-weight:620}
.md h3{font-size:10.5px;color:var(--muted);margin:16px 0 7px}
.md code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--accent)}
.md ul{margin:6px 0;padding-left:18px;color:var(--ink-2)}
.md li{margin:3px 0}
.md strong{color:var(--ink)}
.md p{margin:7px 0;color:var(--ink-2)}
.md em{color:var(--muted)}
.md table{margin:8px 0}

.evi{border-left:2px solid var(--accent);padding:8px 0 8px 11px;margin:9px 0;font-size:12px;color:var(--ink-2);line-height:1.6}
.evi .src{font-family:var(--mono);font-size:10.5px;color:var(--accent);display:block;margin-bottom:3px}
.quote{margin-top:7px;color:var(--muted);font-size:11.5px;font-style:italic}

.empty{color:var(--muted);font-size:12.5px;padding:26px 10px;text-align:center;line-height:1.7}
.attr-row{display:flex;align-items:center;gap:9px;margin:5px 0;font-size:12px}
.attr-row .k{width:88px;color:var(--ink-2)}
.attr-row .bar{flex:1;height:8px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.attr-row .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--s1)}
.attr-row .v{width:54px;text-align:right;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}

/* --------------------------------------------------------- overlays */
.overlay{
  position:absolute;left:16px;bottom:16px;font-size:11px;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);border-radius:9px;
  padding:8px 12px;pointer-events:none;line-height:1.7;box-shadow:var(--shadow);
}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:5px}
.zoom button{
  width:30px;height:30px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;font-size:14px;color:var(--ink-2);
}
.zoom button:hover{color:var(--ink);border-color:var(--accent)}

.tooltip{
  position:fixed;pointer-events:none;z-index:60;background:var(--surface);
  border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:12px;
  box-shadow:var(--shadow);max-width:280px;line-height:1.5;opacity:0;transition:opacity .1s;
}
.tooltip.on{opacity:1}
.tooltip .tt-t{font-weight:620;margin-bottom:3px}
.tooltip .tt-r{display:flex;gap:10px;align-items:center;color:var(--ink-2)}
.tooltip .tt-r i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.tooltip .tt-r b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}

.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(2px);
  z-index:70;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;
}
.scrim.on{display:flex}
.pal{
  width:min(620px,92vw);background:var(--surface);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
}
.pal input{
  width:100%;padding:15px 18px;border:none;background:none;outline:none;font-size:15px;
  border-bottom:1px solid var(--border);
}
.pal .results{max-height:min(52vh,420px);overflow-y:auto;padding:6px}
.pal .r{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;
  cursor:pointer;font-size:13.5px;
}
.pal .r.sel{background:var(--accent-wash)}
.pal .r .ic{width:20px;text-align:center;color:var(--muted);font-size:12px;flex:0 0 auto}
.pal .r .m{flex:1;min-width:0}
.pal .r .m small{display:block;color:var(--muted);font-size:11px;line-height:1.4}
.pal .r .tag{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pal .foot{
  padding:9px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);
  display:flex;gap:14px;
}
.help{width:min(560px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow)}
.help h2{margin:0 0 4px;font-size:16px;font-weight:640}
.help p{margin:0 0 16px;font-size:12.5px;color:var(--ink-2)}
.help .kgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 22px}
.help .kr{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2)}
.help .kr kbd{flex:0 0 auto}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--axis);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

@media (max-width:1180px){
  main.with-panels{grid-template-columns:1fr 360px}
  aside{display:none}
  .g-tiles{grid-template-columns:repeat(2,1fr)}
  .g-3,.g-2{grid-template-columns:1fr}
}
@media print{
  header,nav,.zoom,.notice{display:none}
  body{overflow:visible}
}
</style>
</head>
<body>
<div id="app">
  <div class="notice">Demonstration system — every person, number, case and transaction shown is synthetic and fictional.</div>
  <header>
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2.4"/>
        <circle cx="18" cy="6" r="2.4"/><circle cx="12" cy="17" r="2.4"/>
        <path d="M7.9 8.6 10.6 15M16.6 8.1 13.5 15.3M8.3 6.6 15.6 6.2"/></svg></span>
      <div><div class="t">Criminal Network Analysis</div>
           <div class="s">SIH 2026 · PS 26189</div></div>
    </div>
    <nav id="nav"></nav>
    <span class="spacer"></span>
    <span class="chip" id="chip-a">—</span>
    <span class="chip" id="chip-b">—</span>
    <button class="kbtn" id="cmdbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Search <kbd>⌘K</kbd></button>
    <button class="icon-btn" id="theme" title="Toggle theme (T)"></button>
    <button class="icon-btn" id="helpbtn" title="Keyboard shortcuts (?)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.8-.9 1.4v.4"/><path d="M12 17h.01"/></svg></button>
    <select class="role" id="role" title="Signed in as">
      <option value="demo-investigator">Investigator — PSI A. Kulkarni</option>
      <option value="demo-supervisor">Supervisor — ACP R. Menon</option>
      <option value="demo-admin">Administrator</option>
      <option value="demo-viewer">Viewer (redacted)</option>
    </select>
  </header>
  <main id="main" class="wide">
    <aside id="left"></aside>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="scroller" id="scroller" hidden></div>
      <div class="overlay" id="overlay" hidden></div>
      <div class="zoom" id="zoom" hidden>
        <button id="zin" title="Zoom in">+</button>
        <button id="zout" title="Zoom out">−</button>
        <button id="zfit" title="Fit to view">⤢</button>
      </div>
    </div>
    <div class="side" id="right"></div>
  </main>
</div>
<div class="tooltip" id="tip"></div>
<div class="scrim" id="palscrim">
  <div class="pal">
    <input id="palq" placeholder="Search subjects, findings, views, or ask a question…" autocomplete="off">
    <div class="results" id="palres"></div>
    <div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span></div>
  </div>
</div>
<div class="scrim" id="helpscrim"><div class="help" id="helpbox"></div></div>
<script>
/* =====================================================================
   Criminal Network Analysis System — investigator console.

   Dependency-free on purpose: no CDN, no build step, no npm. A demo that
   needs the internet to draw its own graph is a demo that fails on venue
   wifi. Force-directed layout, canvas renderer, SVG charts, markdown and
   the command palette are all plain ES2020 against the REST API, so the
   view layer is a swap rather than a rewrite.
   ===================================================================== */

const API = '';
let TOKEN = 'demo-investigator';

const State = {

async function api(path, opts = {}) {
  const res = await fetch(API + path, {...opts, headers: {
    'X-Auth-Token': TOKEN, 'Content-Type': 'application/json', ...(opts.headers || {})}});
  if (!res.ok) throw new Error(res.status + ': ' + (await res.text()).slice(0, 200));

/* -------------------------------------------------------- tiny markdown */
function md(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const out = []; let table = null, list = null;
  const closeList = () => { if (list) { out.push('</ul>'); list = null; } };
  const closeTable = () => {
    if (!table) return;
    out.push('<table><thead><tr>' + table.head.map(h => `<th>${inline(h)}</th>`).join('') +
      '</tr></thead><tbody>' + table.rows.map(r => '<tr>' +
      r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
    table = null;
  };
  for (const raw of (src || '').split('\n')) {
    const line = raw.trimEnd();
    if (/^\|/.test(line)) {
      if (/^[\s|:-]+$/.test(line)) continue;
      const cells = line.split('|').slice(1, -1).map(c => c.trim());
      if (!table) table = {head: cells, rows: []}; else table.rows.push(cells);
      continue;
    }
    closeTable();
    if (/^#{1,3}\s/.test(line)) {
      closeList();
      const lvl = Math.min(line.match(/^#+/)[0].length + 1, 4);
      out.push(`<h${lvl}>${inline(line.replace(/^#+\s*/, ''))}</h${lvl}>`);
    } else if (/^[-*]\s/.test(line)) {
      if (!list) { out.push('<ul>'); list = true; }
      out.push(`<li>${inline(line.replace(/^[-*]\s*/, ''))}</li>`);
    } else if (!line.trim()) closeList();
    else { closeList(); out.push(`<p>${inline(line)}</p>`); }
  }
  closeList(); closeTable();
  return out.join('');
}

/* ============================== CHARTS ==============================
   Built to a fixed spec rather than by eye: bars <= 24px with a 4px
   rounded data-end and a 2px surface gap, 2px lines, >= 8px end markers
   with a 2px surface ring, hairline solid grid, selective direct labels,
   and a table view for every chart so no value is gated behind a hover.
   ==================================================================== */
const tip = document.getElementById('tip');
function showTip(html, x, y) {
  tip.innerHTML = html; tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x + 14, innerWidth - r.width - 10) + 'px';
  tip.style.top = Math.max(10, y - r.height - 12) + 'px';
}
const hideTip = () => tip.classList.remove('on');

function barChart(rows, opts = {}) {
  const {ordinal = false, unit = '', hue = 'var(--s1)'} = opts;
  const max = Math.max(...rows.map(r => r.value), 1);
  const H = 26, pad = 4, w = 100;               // percent-based widths
  const ramp = ['var(--o1)', 'var(--o2)', 'var(--o3)', 'var(--o4)'];
  return `<div class="chart">${rows.map((r, i) => {
    const pct = Math.max((r.value / max) * 72, 0.8);
    const fill = ordinal ? ramp[Math.min(i, ramp.length - 1)] : hue;
    return `<div class="bar-row" data-i="${i}" style="display:flex;align-items:center;
      gap:10px;margin:${pad}px 0;min-height:22px;cursor:default">
      <span style="width:150px;flex:0 0 auto;font-size:12px;color:var(--ink-2);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
        title="${esc(r.label)}">${esc(r.label)}</span>
      <span style="flex:1;position:relative;height:14px;min-width:40px">
        <i style="position:absolute;left:0;top:2px;height:10px;width:${pct}%;
          background:${fill};border-radius:0 4px 4px 0"></i></span>
      <span style="width:${unit ? 62 : 44}px;text-align:right;font-size:12px;
        font-variant-numeric:tabular-nums;color:var(--ink)">${fmt(r.value)}${unit}</span>
    </div>`;
  }).join('')}</div>`;
}

function barTable(rows, head = ['Category', 'Count']) {
  return `<table><thead><tr><th>${head[0]}</th><th class="num">${head[1]}</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(r.label)}</td>
    <td class="num">${fmt(r.value)}</td></tr>`).join('')}</tbody></table>`;
}

function lineChart(weeks, series, id) {
  const W = 560, H = 170, ml = 38, mr = 96, mt = 12, mb = 26;
  const pw = W - ml - mr, ph = H - mt - mb;
  const all = series.flatMap(s => s.points);
  const max = Math.max(...all, 1);
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const top = Math.ceil(max / step) * step;
  const x = i => ml + (weeks.length === 1 ? pw / 2 : (i / (weeks.length - 1)) * pw);
  const y = v => mt + ph - (v / top) * ph;
  const hues = ['var(--s1)', 'var(--s2)'];
  const ticks = [0, top / 2, top];

  const grid = ticks.map(t => `<line x1="${ml}" x2="${ml + pw}" y1="${y(t)}" y2="${y(t)}"
      stroke="var(--grid)" stroke-width="1"/>
    <text x="${ml - 8}" y="${y(t) + 3.5}" text-anchor="end" font-size="10"
      fill="var(--muted)" style="font-variant-numeric:tabular-nums">${fmt(t)}</text>`).join('');

  const xlabels = weeks.map((w, i) =>
    (i % Math.ceil(weeks.length / 5) === 0 || i === weeks.length - 1)
      ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10"
          fill="var(--muted)">${w.slice(5)}</text>` : '').join('');

  const paths = series.map((s, si) => {
    const d = s.points.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
    const last = s.points.length - 1;
    return `<path d="${d}" fill="none" stroke="${hues[si]}" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(last)}" cy="${y(s.points[last])}" r="4.5" fill="${hues[si]}"
        stroke="var(--surface)" stroke-width="2"/>
      <text x="${x(last) + 10}" y="${y(s.points[last]) + 3.5}" font-size="11"
        fill="var(--ink-2)">${esc(s.label)}</text>`;
  }).join('');

  const hits = weeks.map((w, i) =>
    `<rect x="${x(i) - pw / (weeks.length * 2) - 2}" y="${mt}"
       width="${pw / weeks.length + 4}" height="${ph}" fill="transparent"
       data-week="${i}" style="cursor:crosshair"/>`).join('');

  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" id="${id}" role="img"
      aria-label="Weekly activity">
    ${grid}<line x1="${ml}" x2="${ml + pw}" y1="${y(0)}" y2="${y(0)}"
      stroke="var(--axis)" stroke-width="1"/>${xlabels}
    <line id="${id}-cross" x1="0" x2="0" y1="${mt}" y2="${mt + ph}" stroke="var(--axis)"
      stroke-width="1" opacity="0"/>${paths}${hits}</svg></div>`;
}

function lineTable(weeks, series) {
  return `<table><thead><tr><th>Week of</th>${series.map(s =>
      `<th class="num">${esc(s.label)}</th>`).join('')}</tr></thead>
    <tbody>${weeks.map((w, i) => `<tr><td>${w}</td>${series.map(s =>
      `<td class="num">${fmt(s.points[i])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

const ICON = {

    stroke-linecap="round"><path d="M12 3.6 2.6 20h18.8L12 3.6Z"/><path d="M12 10v4M12 17.2h.01"/></svg>`,
  warning: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
    stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2h.01"/></svg>`,
  good: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.7 2.7L16 9.6"/></svg>`,
};
const sevBadge = s => `<span class="sev ${s}">${ICON[s === 'high' ? 'critical'
  : s === 'medium' ? 'warning' : 'good']}${s}</span>`;

/* ============================ DASHBOARD ============================ */
function panel(id, title, sub, chartHtml, tableHtml) {
  const showing = State.tables.has(id);
  return `<div class="panel"><div class="panel-head"><h2>${esc(title)}</h2>
      <span class="sub">${esc(sub)}</span>
      <button class="tbtn ${showing ? 'on' : ''}" data-table="${id}">table</button></div>
    ${showing ? tableHtml : chartHtml}</div>`;
}

  const d = State.dash;

  const tiles = d.tiles.map((t, i) => `<div class="tile ${i === 0 ? 'hero' : ''}">
      <div class="lbl">${esc(t.label)}</div>
      <div class="val" ${t.status === 'critical' ? 'style="color:var(--critical)"' : ''}>${fmt(t.value)}</div>
      <div class="hint">${esc(t.hint)}</div></div>`).join('');

  const sev = `<div class="status-row">${d.severity.map(s => `<div class="r"
      style="color:var(--${s.status})">${ICON[s.status]}
      <span class="t">${esc(s.label)} severity</span>

  el.innerHTML = `<div class="dash">
    <div class="dash-head"><div>
      <h1>Case overview</h1>
      <p>Eight fragmented sources, reconciled into one network. Every figure below
         resolves to the records that produced it — open the Network view to trace any of them.</p>

      <a class="dl" href="/api/report/overview.pdf" download>⤓ Case summary (PDF)</a></div>

    <div class="grid g-tiles">${tiles}</div>

    <div class="grid g-3" style="margin-top:12px">
      ${panel('ftype', 'Findings by type', `${d.findings_by_type.length} detectors fired`,
        barChart(d.findings_by_type), barTable(d.findings_by_type, ['Finding type', 'Count']))}
      ${panel('src', 'Where the evidence comes from', 'links attested per source system',
        barChart(d.by_source), barTable(d.by_source, ['Source system', 'Links']))}
      <div class="panel"><div class="panel-head"><h2>Severity</h2>
        <span class="sub">of ${d.severity.reduce((a, s) => a + s.count, 0)} findings</span></div>
        ${sev}
        <div class="kv" style="margin-top:16px;border-top:1px solid var(--border);padding-top:13px">
          <div class="r"><span class="k">Subjects merged across scripts</span>
            <span class="v">${h.cross_script_subjects}</span></div>
          <div class="r"><span class="k">Scanned pages read by OCR</span>
            <span class="v">${h.scanned_pages_read}</span></div>
          <div class="r"><span class="k">OCR text recovered</span>
            <span class="v">${h.ocr_recovery === null ? '—' : Math.round(h.ocr_recovery * 100) + '%'}</span></div>
        </div></div>
    </div>

    <div class="grid g-2" style="margin-top:12px">
      ${panel('act', 'Network activity over time', 'attributed calls and transactions, weekly',
        lineChart(d.activity.weeks, d.activity.series, 'act-svg') +
        `<div class="legend">${d.activity.series.map((s, i) =>
          `<span><i style="background:var(--s${i + 1})"></i>${esc(s.label)}</span>`).join('')}</div>`,
        lineTable(d.activity.weeks, d.activity.series))}
      ${panel('corr', 'Independent corroboration', 'source systems attesting each link',
        barChart(d.corroboration, {ordinal: true}) +
        `<p style="margin-top:9px;font-size:11.5px;color:var(--muted)">A link seen in
          three systems is qualitatively stronger evidence than three sightings in one.</p>`,
        barTable(d.corroboration, ['Independent sources', 'Links']))}
    </div>

    <div class="grid g-2" style="margin-top:12px">
      ${panel('top', 'Most influential subjects', 'weighted centrality, prior record and bridging',
        barChart(d.top_subjects.map(t => ({label: t.label, value: t.value}))) +
        `<p style="margin-top:9px;font-size:11.5px;color:var(--muted)">Open a subject to see the
          Shapley breakdown of their score.</p>`,
        `<table><thead><tr><th>#</th><th>Subject</th><th class="num">Score</th>
          <th>Driven by</th></tr></thead><tbody>${d.top_subjects.map(t =>
          `<tr class="clk" data-goto="${esc(t.id)}"><td>${t.rank}</td><td>${esc(t.label)}</td>

  });
  wireBarHover(el);
  wireLineHover(el, d);
}

/* --------------------------------------------------------- case intake
   Two ways new evidence enters: an investigator files one document at a
   time (data:submit), or an admin bulk-loads/replaces a whole source file
   to stand up a new case (data:ingest). Either way the pipeline reruns
   before the page hands control back — nothing is queued for later. */

const INTAKE_KINDS = {
  fir: {label: 'FIR', textLabel: 'Narrative', textKey: 'narrative',
    meta: [{k: 'station', ph: 'Police station'}, {k: 'district', ph: 'District'},
           {k: 'sections', ph: 'Sections (e.g. NDPS Act s.21)'}]},
  surveillance: {label: 'Surveillance log', textLabel: 'Observation', textKey: 'observation',
    meta: [{k: 'unit', ph: 'Observing unit'}, {k: 'location', ph: 'Location'}]},
  social: {label: 'Social media tip', textLabel: 'Post text', textKey: 'text',
    meta: [{k: 'platform', ph: 'Platform (e.g. X)'}, {k: 'handle', ph: 'Handle'}]},
};
const BULK_KINDS = [
  ['fir', 'FIR documents (firs.json)'], ['surveillance', 'Surveillance logs (surveillance.json)'],
  ['social', 'Social media (social_media.json)'], ['cdr', 'Call records (cdr.csv)'],
  ['transactions', 'Transactions (transactions.csv)'],
  ['criminal_records', 'Criminal records (criminal_records.csv)'],
  ['scan', 'Scanned document image'],
];

function renderIntake() {
  const el = document.getElementById('scroller');
  const perms = State.me?.permissions || [];
  const canSubmit = perms.includes('data:submit'), canIngest = perms.includes('data:ingest');

  const quickCard = canSubmit ? `
    <div class="panel">
      <div class="panel-head"><h2>File a new document</h2>
        <span class="sub">One FIR, surveillance log or tip at a time — the graph rebuilds the moment you submit.</span></div>
      <label class="flabel">Document type</label>
      <select class="q" id="ikind">${Object.entries(INTAKE_KINDS).map(([k, v]) =>
        `<option value="${k}">${esc(v.label)}</option>`).join('')}</select>
      <div id="imeta"></div>
      <label class="flabel" id="itextlabel">Narrative</label>
      <textarea class="q" id="itext" rows="6"></textarea>
      <div class="btn-row"><button class="btn primary" id="isubmit">Add &amp; re-analyse</button></div>
      <div id="iresult"></div>
    </div>` : `
    <div class="panel"><div class="panel-head"><h2>File a new document</h2>
      <span class="sub">Sign in as an investigator, supervisor or admin to file documents.</span></div></div>`;

  const bulkCard = canIngest ? `
    <div class="panel">
      <div class="panel-head"><h2>Load a case dataset</h2>
        <span class="sub">Replace a source entirely to start a new case, or append a fresh batch
          (e.g. a new CDR dump) to the current one.</span></div>
      <label class="flabel">Source</label>
      <select class="q" id="bkind">${BULK_KINDS.map(([k, l]) =>
        `<option value="${k}">${esc(l)}</option>`).join('')}</select>
      <label class="flabel">Mode</label>
      <select class="q" id="bmode">
        <option value="append">Append to current case</option>
        <option value="replace">Replace this source (new case)</option>
      </select>
      <label class="flabel">File</label>
      <input class="q" id="bfile" type="file" accept=".json,.csv,image/*">
      <div class="btn-row"><button class="btn primary" id="bsubmit">Upload &amp; re-analyse</button></div>
      <div id="bresult"></div>
    </div>` : `
    <div class="panel"><div class="panel-head"><h2>Load a case dataset</h2>
      <span class="sub">Restricted to administrators.</span></div>
      <p style="font-size:12.5px;color:var(--ink-2);margin-top:8px">Switch to the Administrator role in
      the top right to bulk-load or replace a source file.</p></div>`;

  el.innerHTML = `<div class="dash">
    <div class="dash-head"><div>
      <h1>Add case data</h1>
      <p>Everything the system knows comes from what's filed here. A submission reruns extraction,
         entity resolution, graph analytics and all nine anomaly detectors before you leave this page.</p>
    </div></div>
    <div class="grid g-2">${quickCard}${bulkCard}</div>
    <div class="panel" style="margin-top:12px">
      <div class="panel-head"><h2>How this works</h2></div>
      <p class="hint">Filing a document adds it alongside the current case's other records — names, phone
      numbers, vehicles and locations in the text are extracted and merged into the existing graph.
      Uploading a source file with <b>Replace</b> swaps that entire file, the way you'd stand up a fresh
      case's CDRs or transaction dump. To swap every source at once for a brand-new case, replace each
      of the six files in turn. Every submission is written to the audit log under your name and role.</p>
    </div>
  </div>`;

  if (canSubmit) {
    const kindSel = document.getElementById('ikind');
    const renderMeta = () => {
      const cfg = INTAKE_KINDS[kindSel.value];
      document.getElementById('imeta').innerHTML = cfg.meta.map(m =>
        `<label class="flabel">${esc(m.ph)}</label><input class="q" data-meta="${m.k}">`).join('');
      document.getElementById('itextlabel').textContent = cfg.textLabel;
    };
    kindSel.onchange = renderMeta;
    renderMeta();

    document.getElementById('isubmit').onclick = async () => {
      const cfg = INTAKE_KINDS[kindSel.value];
      const fields = {};
      document.querySelectorAll('#imeta [data-meta]').forEach(i => {
        if (i.value) fields[i.dataset.meta] = i.value; });
      fields[cfg.textKey] = document.getElementById('itext').value;
      const btn = document.getElementById('isubmit'), out = document.getElementById('iresult');
      if (!fields[cfg.textKey].trim()) { out.innerHTML = intakeErr('Enter the document text first.'); return; }
      btn.textContent = 'Analysing…'; btn.disabled = true;
      try {
        const r = await api('/api/case/quick-add', {method: 'POST',
          body: JSON.stringify({kind: kindSel.value, fields})});
        out.innerHTML = intakeOk(r);
        wireIntakeResult(out);
        document.getElementById('itext').value = '';
        document.querySelectorAll('#imeta [data-meta]').forEach(i => i.value = '');
        await refreshAfterIntake();
      } catch (e) { out.innerHTML = intakeErr(e.message); }
      btn.textContent = 'Add & re-analyse'; btn.disabled = false;
    };
  }

  if (canIngest) {
    document.getElementById('bsubmit').onclick = async () => {
      const kind = document.getElementById('bkind').value, mode = document.getElementById('bmode').value;
      const file = document.getElementById('bfile').files[0];
      const btn = document.getElementById('bsubmit'), out = document.getElementById('bresult');
      if (!file) { out.innerHTML = intakeErr('Choose a file first.'); return; }
      btn.textContent = 'Uploading…'; btn.disabled = true;
      try {
        const fd = new FormData();
        fd.append('kind', kind); fd.append('mode', mode); fd.append('file', file);
        const res = await fetch(API + '/api/case/upload',
          {method: 'POST', headers: {'X-Auth-Token': TOKEN}, body: fd});
        if (!res.ok) throw new Error(res.status + ': ' + (await res.text()).slice(0, 200));
        const r = await res.json();
        const extra = r.result.records_added !== undefined
          ? `${r.result.records_added} new record(s) written to ${r.result.file} — ${r.result.records_in_file} total.`
          : `Saved as ${r.result.file}.`;
        out.innerHTML = intakeOk(r, extra);
        wireIntakeResult(out);
        document.getElementById('bfile').value = '';
        await refreshAfterIntake();
      } catch (e) { out.innerHTML = intakeErr(e.message); }
      btn.textContent = 'Upload & re-analyse'; btn.disabled = false;
    };
  }
}

/* ========================== GRAPH LAYOUT ========================== */
function layout(nodes, edges, iterations = 520) {
  const arr = [...nodes.values()], n = arr.length || 1;
  const area = Math.max(900 * 700, n * 22000), k = Math.sqrt(area / n) * 1.15;
  const idx = new Map(arr.map((d, i) => [d.id, i]));
  arr.forEach((d, i) => {
    if (d.x === undefined) {
      const a = (i / n) * Math.PI * 2, r = 120 + Math.random() * 420;
      d.x = Math.cos(a) * r; d.y = Math.sin(a) * r;
    }
    d.vx = 0; d.vy = 0;
  });
  const links = edges.map(e => [idx.get(e.source), idx.get(e.target), e.weight || 1])
    .filter(l => l[0] !== undefined && l[1] !== undefined);
  for (let it = 0; it < iterations; it++) {
    const t = 1 - it / iterations;
    for (let i = 0; i < arr.length; i++)
      for (let j = i + 1; j < arr.length; j++) {
        let dx = arr[i].x - arr[j].x, dy = arr[i].y - arr[j].y, d2 = dx * dx + dy * dy;
        if (d2 < 1e-4) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1e-4; }
        const dd = Math.sqrt(d2), f = (k * k) / d2 * 1.15;
        arr[i].vx += dx / dd * f; arr[i].vy += dy / dd * f;
        arr[j].vx -= dx / dd * f; arr[j].vy -= dy / dd * f;
      }
    for (const [a, b, w] of links) {
      const A = arr[a], B = arr[b], dx = B.x - A.x, dy = B.y - A.y;
      const dd = Math.hypot(dx, dy) || 1e-4, f = (dd * dd) / k / 11 * Math.min(w, 3);
      A.vx += dx / dd * f; A.vy += dy / dd * f;
      B.vx -= dx / dd * f; B.vy -= dy / dd * f;
    }
    for (const d of arr) {
      d.vx -= d.x * 0.032; d.vy -= d.y * 0.032;
      const sp = Math.hypot(d.vx, d.vy), cap = 22 * t + 1, s = sp > cap ? cap / sp : 1;
      d.x += d.vx * s * 0.55; d.y += d.vy * s * 0.55;
    }
  }
}

/* =========================== CANVAS ============================== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let DPR = window.devicePixelRatio || 1;

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  DPR = window.devicePixelRatio || 1;
  cv.width = r.width * DPR; cv.height = r.height * DPR;
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  draw();
}
addEventListener('resize', resize);

const withinTime = e => {
  const at = State.filters.timeAt;
  return !at || !e.first_seen || e.first_seen.slice(0, 10) <= at;
};
function dayList() {
  const {min, max} = State.timeline;
  if (!min || !max) return [];
  const out = [];
  for (let d = new Date(min); d <= new Date(max); d.setDate(d.getDate() + 1))
    out.push(d.toISOString().slice(0, 10));
  return out;
}
const visibleNodes = () => [...State.nodes.values()].filter(n =>
  State.filters.types.has(n.type) && (!State.focus || State.focus.has(n.id)));
function visibleEdges() {
  const ids = new Set(visibleNodes().map(n => n.id));
  return State.edges.filter(e => ids.has(e.source) && ids.has(e.target) &&
    e.confidence >= State.filters.minConfidence &&
    (e.independent_sources || []).length >= State.filters.minCorroboration &&
    (!State.filters.edgeTypes || e.types.some(t => State.filters.edgeTypes.has(t))) &&
    withinTime(e));
}
const nodeRadius = n => n.type === 'PERSON' ? 7 + (n.influence || 0) * 13 : 6.5;

function shapePath(c, n, r) {
  const s = TYPE[n.type]?.shape || 'circle';
  c.beginPath();
  if (s === 'circle') c.arc(n.x, n.y, r, 0, 6.284);
  else if (s === 'square') c.rect(n.x - r * .88, n.y - r * .88, r * 1.76, r * 1.76);
  else if (s === 'triangle') {
    c.moveTo(n.x, n.y - r * 1.15); c.lineTo(n.x + r, n.y + r * .75);
    c.lineTo(n.x - r, n.y + r * .75); c.closePath();
  } else if (s === 'diamond') {
    c.moveTo(n.x, n.y - r * 1.15); c.lineTo(n.x + r * 1.05, n.y);
    c.lineTo(n.x, n.y + r * 1.15); c.lineTo(n.x - r * 1.05, n.y); c.closePath();
  } else {
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 6 + i * Math.PI / 3;
      const px = n.x + Math.cos(a) * r * 1.05, py = n.y + Math.sin(a) * r * 1.05;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath();
  }
}

function draw() {
  if (State.view === 'map') return drawMap();
  const w = cv.width, h = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h);
  const c = State.camera;
  ctx.setTransform(c.k * DPR, 0, 0, c.k * DPR, w / 2 + c.x * DPR, h / 2 + c.y * DPR);

  const nodes = visibleNodes(), edges = visibleEdges();
  const pos = new Map(nodes.map(n => [n.id, n])), sel = State.selected;
  const nbrs = new Set();
  if (sel) edges.forEach(e => {
    if (e.source === sel) nbrs.add(e.target);
    if (e.target === sel) nbrs.add(e.source);
  });
  const surface = css('--surface'), ink = css('--ink'), ink2 = css('--ink-2');
  const tone = k => css('--' + k);

  for (const e of edges) {
    const a = pos.get(e.source), b = pos.get(e.target);
    if (!a || !b) continue;
    const active = !sel || e.source === sel || e.target === sel;
    ctx.strokeStyle = tone(EDGE_TONE[e.types[0]] || 'axis');
    ctx.globalAlpha = active ? (0.22 + e.confidence * 0.4) : 0.05;
    ctx.lineWidth = Math.max(0.7, Math.min(e.weight * 0.5, 3.4)) / c.k;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  const labels = [];
  for (const n of nodes) {
    const r = nodeRadius(n), dim = sel && n.id !== sel && !nbrs.has(n.id);
    ctx.globalAlpha = dim ? 0.2 : 1;
    if (n.id === sel) {
      ctx.beginPath(); ctx.arc(n.x, n.y, r + 8, 0, 6.284);
      ctx.fillStyle = css('--accent-wash'); ctx.fill();
    }
    shapePath(ctx, n, r);
    ctx.fillStyle = tone(n.type === 'PERSON' ? 's1' : n.type === 'ORG' ? 's2'
      : n.type === 'LOCATION' ? 's3' : n.type === 'VEHICLE' ? 's4' : 's5');
    ctx.fill();
    ctx.lineWidth = 2 / c.k; ctx.strokeStyle = surface; ctx.stroke();   // surface ring
    if (n.type === 'PERSON' && n.prior_cases >= 2) {
      ctx.lineWidth = 1.8 / c.k; ctx.strokeStyle = tone('critical');
      shapePath(ctx, n, r + 2.4); ctx.stroke();
    }
    labels.push({n, r, dim, p: (n.id === sel ? 3 : nbrs.has(n.id) ? 2
      : n.type === 'PERSON' ? 1 : 0) + (n.influence || 0)});
    ctx.globalAlpha = 1;
  }

  // Labels last, most important first, skipping any that would collide.
  labels.sort((a, b) => b.p - a.p);
  const boxes = [], fs = Math.max(10, 11 / c.k);
  ctx.font = `${fs}px ${css('--sans') || 'system-ui'}`;
  ctx.textAlign = 'center';
  for (const {n, r, dim} of labels) {
    if (dim && sel) continue;
    const text = n.label || n.id, half = ctx.measureText(text).width / 2 + 2 / c.k;
    const cx = n.x, cy = n.y + r + 13 / c.k;
    const box = [cx - half, cy - fs * .85, cx + half, cy + fs * .35];
    if (boxes.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3])))
      continue;
    boxes.push(box);
    ctx.globalAlpha = dim ? .25 : .95;
    ctx.fillStyle = n.type === 'PERSON' ? ink : ink2;
    ctx.fillText(text, cx, cy);
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  const ov = document.getElementById('overlay');
  ov.innerHTML = `${nodes.length} entities · ${edges.length} links shown` +
    (State.focus ? `<br><span style="color:var(--accent)">filtered — press Esc to clear</span>` : '') +
    (sel ? `<br>selected: ${esc(State.nodes.get(sel)?.label || '')}` : '');
}

function drawMap() {
  const pts = [...State.nodes.values()].filter(n => n.lat && n.lon);
  const r = cv.parentElement.getBoundingClientRect();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!pts.length) return;
  const lats = pts.map(p => p.lat), lons = pts.map(p => p.lon);
  const [la0, la1] = [Math.min(...lats), Math.max(...lats)];
  const [lo0, lo1] = [Math.min(...lons), Math.max(...lons)];
  const pad = 84;
  const X = lo => pad + (lo - lo0) / ((lo1 - lo0) || 1) * (r.width - pad * 2);
  const Y = la => r.height - pad - (la - la0) / ((la1 - la0) || 1) * (r.height - pad * 2);
  ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1;
  for (let i = 0; i <= 8; i++) {
    const x = pad + i / 8 * (r.width - pad * 2), y = pad + i / 8 * (r.height - pad * 2);
    ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, r.height - pad); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(r.width - pad, y); ctx.stroke();
  }
  const counts = new Map();
  for (const e of State.edges)
    for (const id of [e.source, e.target]) {
      const n = State.nodes.get(id);
      if (n && n.type === 'LOCATION') counts.set(id, (counts.get(id) || 0) + 1);
    }
  const maxC = Math.max(...[...counts.values()], 1);
  for (const p of pts) {
    const x = X(p.lon), y = Y(p.lat), c = counts.get(p.id) || 1;
    const rad = 7 + (c / maxC) * 22;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.284);
    ctx.fillStyle = css('--accent-wash'); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 6.284);
    ctx.fillStyle = css('--s3'); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = css('--surface'); ctx.stroke();
    ctx.fillStyle = css('--ink'); ctx.font = '12px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(p.label, x, y + rad + 15);
    ctx.fillStyle = css('--muted'); ctx.font = '10px system-ui';
    ctx.fillText(c + ' link' + (c === 1 ? '' : 's'), x, y + rad + 28);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  document.getElementById('overlay').innerHTML =
    `${pts.length} locations, sized by activity<br>cell sites, FIR locations and
     surveillance points on one plane`;
}

/* ========================= INTERACTION ========================= */
let dragging = null, panning = false, last = null;
const toWorld = ev => {
  const r = cv.getBoundingClientRect(), c = State.camera;
  return {x: (ev.clientX - r.left - r.width / 2 - c.x) / c.k,
          y: (ev.clientY - r.top - r.height / 2 - c.y) / c.k};
};
function hit(ev) {
  const p = toWorld(ev);
  let best = null, bd = 1e9;
  for (const n of visibleNodes()) {
    const d = Math.hypot(n.x - p.x, n.y - p.y);
    // hit area is generously bigger than the mark
    if (d < nodeRadius(n) + 9 && d < bd) { best = n; bd = d; }
  }
  return best;
}
cv.addEventListener('mousedown', ev => {
  const n = hit(ev);
  if (n) dragging = n; else { panning = true; cv.classList.add('drag'); }
  last = {x: ev.clientX, y: ev.clientY};
});
addEventListener('mousemove', ev => {
  if (!last) {
    if (State.view === 'graph') {
      const n = hit(ev);
      if (n) {
        const e = State.edges.filter(x => x.source === n.id || x.target === n.id).length;
        showTip(`<div class="tt-t">${esc(n.label)}</div>
          <div class="tt-r">${TYPE[n.type]?.label || n.type}</div>
          <div class="tt-r">${e} link${e === 1 ? '' : 's'}${n.rank ? ` · rank ${n.rank}` : ''}</div>`,
          ev.clientX, ev.clientY);
        cv.style.cursor = 'pointer';
      } else { hideTip(); cv.style.cursor = ''; }
    }
    return;
  }
  const dx = ev.clientX - last.x, dy = ev.clientY - last.y;
  if (dragging) { dragging.x += dx / State.camera.k; dragging.y += dy / State.camera.k; draw(); }
  else if (panning) { State.camera.x += dx; State.camera.y += dy; draw(); }
  last = {x: ev.clientX, y: ev.clientY};
});
addEventListener('mouseup', () => {
  dragging = null; panning = false; last = null; cv.classList.remove('drag');
});
cv.addEventListener('click', ev => {
  const n = hit(ev);
  if (n) selectNode(n.id); else { State.selected = null; renderRight(); draw(); }
});
cv.addEventListener('dblclick', ev => { const n = hit(ev); if (n) expandNeighbourhood(n.id); });
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  State.camera.k = Math.max(.25, Math.min(4, State.camera.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
  draw();
}, {passive: false});
document.getElementById('zin').onclick = () => { State.camera.k = Math.min(4, State.camera.k * 1.25); draw(); };
document.getElementById('zout').onclick = () => { State.camera.k = Math.max(.25, State.camera.k / 1.25); draw(); };
document.getElementById('zfit').onclick = () => fit();

function fit() {
  const ns = visibleNodes();
  if (!ns.length) return;
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y);
    return s[Math.min(s.length - 1, Math.max(0, Math.round((s.length - 1) * p)))]; };
  const xs = ns.map(n => n.x), ys = ns.map(n => n.y);
  const x0 = q(xs, .03), x1 = q(xs, .97), y0 = q(ys, .03), y1 = q(ys, .97);
  const w = (x1 - x0) + 300, h = (y1 - y0) + 240;
  const r = cv.parentElement.getBoundingClientRect();
  State.camera.k = Math.max(.3, Math.min(2.2, Math.min(r.width / w, r.height / h)));
  State.camera.x = -((x1 + x0) / 2) * State.camera.k;
  State.camera.y = -((y1 + y0) / 2) * State.camera.k;
  draw();
}

/* ============================ PANELS ============================ */
async function selectNode(id) {
  if (State.view !== 'graph') setView('graph');
  State.selected = id;
  State.panel = {tab: 'profile', data: null, loading: true};
  const n = State.nodes.get(id);
  if (n) {
    State.recent = [{id, label: n.label}, ...State.recent.filter(r => r.id !== id)].slice(0, 8);
    // centre the selection so a jump from the palette actually shows it
    State.camera.x = -n.x * State.camera.k;
    State.camera.y = -n.y * State.camera.k;
  }
  renderRight(); draw();
  try { State.panel.data = await api('/api/entity/' + encodeURIComponent(id)); }
  catch (e) { State.panel.data = {error: e.message}; }
  State.panel.loading = false; renderRight();
}

async function expandNeighbourhood(id) {
  const n = State.nodes.get(id);
  if (!n) return;
  const r = await api('/api/query', {method: 'POST',
    body: JSON.stringify({q: `everyone connected to ${n.label} within 2 hops`})});
  if (r.result && r.result.nodes) {
    State.focus = new Set(r.result.nodes.map(x => x.id));
    fit(); renderLeft();
  }
}

async function showEvidence(a, b) {
  State.panel = {tab: 'evidence', loading: true, data: null}; renderRight();
  State.panel.data = await api(`/api/evidence?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`);
  State.panel.loading = false; renderRight();
}

    <h3 style="margin-top:15px">Corroborating sources ≥ ${f.minCorroboration}</h3>
    <input type="range" id="corr" min="1" max="3" step="1" value="${f.minCorroboration}">
    <div class="hint">Raise this to keep only links attested by more than one
      independent source system.</div>
  </div>

  <div class="block">
    <h3>Timeline ${f.timeAt ? '— as at ' + f.timeAt : '— full period'}</h3>
    <input type="range" id="time" min="0" max="${Math.max(days.length - 1, 0)}" step="1"
      value="${f.timeAt ? days.indexOf(f.timeAt) : days.length - 1}">
    <div class="btn-row">
      <button class="btn" id="play">${State.timeline.playing ? '❚❚ pause' : '▶ replay'}</button>
      <button class="btn" id="timeall">all</button>
    </div>
    <div class="hint">See the network as it stood on a date, or replay how it formed.
      Undated links stay visible.</div>
  </div>

  <div class="block">
    <h3>Relationship types</h3>
    ${Object.keys(counts).map(t => `
      <label class="row"><input type="checkbox" data-edge="${t}"
        ${!f.edgeTypes || f.edgeTypes.has(t) ? 'checked' : ''}>
        ${t.toLowerCase().replace(/_/g, ' ')}<span class="n">${counts[t]}</span></label>`).join('')}
  </div>

  ${State.focus ? `<div class="block"><button class="btn primary" id="reset"
      style="width:100%">Reset to full network</button></div>` : ''}

  ${State.recent.length ? `<div class="block"><h3>Recently viewed</h3>
    ${State.recent.map(r => `<button class="ex" data-recent="${esc(r.id)}">${esc(r.label)}</button>`).join('')}
  </div>` : ''}

  <div class="block">
    <h3>Reading the graph</h3>
    <div class="hint">Node size is influence; a red ring means two or more prior cases.
      Shape carries entity type as well as colour, so identity never rests on hue alone.
      <br><br>Click a node for its profile · double-click to isolate its 2-hop network
      · drag to reposition.</div>
  </div>`;

  el.querySelectorAll('.ex').forEach(b => b.onclick = () => {
    if (b.dataset.recent) return selectNode(b.dataset.recent);
    document.getElementById('nlq').value = b.textContent; runQuery(b.textContent);
  });
  const q = document.getElementById('nlq');
  q.onkeydown = e => { if (e.key === 'Enter') runQuery(q.value); };
  el.querySelectorAll('[data-type]').forEach(cb => cb.onchange = () => {
    cb.checked ? f.types.add(cb.dataset.type) : f.types.delete(cb.dataset.type); draw();
  });
  el.querySelectorAll('[data-edge]').forEach(cb => cb.onchange = () => {
    if (!f.edgeTypes) f.edgeTypes = new Set(Object.keys(counts));
    cb.checked ? f.edgeTypes.add(cb.dataset.edge) : f.edgeTypes.delete(cb.dataset.edge); draw();
  });
  const on = (id, ev, fn) => { const e = document.getElementById(id); if (e) e[ev] = fn; };
  on('conf', 'oninput', e => { f.minConfidence = +e.target.value; renderLeft(); draw(); });
  on('corr', 'oninput', e => { f.minCorroboration = +e.target.value; renderLeft(); draw(); });
  on('time', 'oninput', e => {
    f.timeAt = (+e.target.value >= days.length - 1) ? null : days[+e.target.value];
    renderLeft(); draw();
  });
  on('timeall', 'onclick', () => { f.timeAt = null; stopPlay(); renderLeft(); draw(); });
  on('play', 'onclick', () => State.timeline.playing ? stopPlay() : startPlay());
  on('reset', 'onclick', () => { State.focus = null; renderLeft(); fit(); });
}

let playTimer = null;
function stopPlay() { clearInterval(playTimer); playTimer = null; State.timeline.playing = false; renderLeft(); }
function startPlay() {
  const days = dayList();
  if (!days.length) return;
  State.timeline.playing = true;
  let i = 0; State.filters.timeAt = days[0];
  renderLeft(); draw();
  playTimer = setInterval(() => {
    if (++i >= days.length) { State.filters.timeAt = null; stopPlay(); draw(); return; }
    State.filters.timeAt = days[i];
    const el = document.getElementById('time'); if (el) el.value = i;
    const lab = [...document.querySelectorAll('#left h3')]
      .find(x => x.textContent.startsWith('Timeline'));
    if (lab) lab.textContent = 'Timeline — as at ' + days[i];
    draw();
  }, 120);
}

/* ------------------------------------------------------ right panel */
function renderRight() {
  const el = document.getElementById('right'), p = State.panel;
  const tabs = [['profile', 'Profile'], ['evidence', 'Evidence'],
                ['findings', 'Findings'], ['report', 'Report']];
  let body = '';
  if (p.loading) body = '<div class="empty">Loading…</div>';
  else if (p.tab === 'findings') body = renderFindings();
  else if (p.tab === 'report') body = p.data && p.data.markdown
      ? (p.data.pdf ? `<a class="dl" href="${p.data.pdf}" download>⤓ ${esc(p.data.pdfLabel || 'Download PDF')}</a>` : '')
        + `<div class="md">${md(p.data.markdown)}</div>`
      : '<div class="empty">Nothing generated yet.<br>Ask a question or open the Report tab.</div>';
  else if (p.tab === 'evidence') body = renderEvidence(p.data);
  else if (!State.selected) body = `<div class="empty">
      No subject selected.<br>Click a node, or press <kbd>⌘K</kbd> to search.</div>`;
  else if (p.data && p.data.error) body = `<div class="empty">${esc(p.data.error)}</div>`;
  else if (p.data && p.data.markdown) body = renderProfile(p.data);
  else body = '<div class="empty">—</div>';

  el.innerHTML = `<div class="tabs">${tabs.map(([k, l]) =>
    `<button data-tab="${k}" class="${p.tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>${body}`;

  el.querySelectorAll('[data-tab]').forEach(b => b.onclick = async () => {
    State.panel.tab = b.dataset.tab;
    if (b.dataset.tab === 'report') {
      State.panel.loading = true; renderRight();
      State.panel.data = {...(await api('/api/report/overview')),
        pdf: '/api/report/overview.pdf', pdfLabel: 'Case summary (PDF)'};
      State.panel.loading = false;
    } else if (b.dataset.tab === 'profile' && State.selected) return selectNode(State.selected);
    renderRight();
  });
  el.querySelectorAll('[data-evi]').forEach(b => b.onclick = () => {
    const [a, bb] = b.dataset.evi.split('|'); showEvidence(a, bb);
  });
  el.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => selectNode(b.dataset.goto));
}

function attributionBars(infl) {
  if (!infl || !infl.attribution) return '';
  const rows = Object.entries(infl.attribution).sort((a, b) => b[1] - a[1]);
  const max = Math.max(...rows.map(r => Math.abs(r[1])), 0.001);
  return `<h3 style="margin-top:18px">Why this ranking</h3>
    <div class="hint" style="margin:0 0 9px">Shapley contribution of each component against a
      network baseline of ${infl.baseline}. The six values sum exactly to this subject's score.</div>
    ${rows.map(([k, v]) => `<div class="attr-row">
      <span class="k">${k.replace(/_/g, ' ')}</span>
      <span class="bar"><i style="width:${Math.abs(v) / max * 100}%;
        background:${v >= 0 ? 'var(--s1)' : 'var(--critical)'}"></i></span>
      <span class="v">${v >= 0 ? '+' : ''}${v.toFixed(3)}</span></div>`).join('')}`;
}

/* ============================ QUERIES ============================ */
async function runQuery(q) {
  if (!q || !q.trim()) return;
  let r;
  try { r = await api('/api/query', {method: 'POST', body: JSON.stringify({q})}); }
  catch (e) { alert(e.message); return; }
  const p = r.parsed;
  if (p.intent === 'unknown') { alert(p.interpretation); return; }
  if (State.view !== 'graph') setView('graph');

  if (p.intent === 'neighbourhood' && r.result && r.result.nodes) {
    State.focus = new Set(r.result.nodes.map(n => n.id));
    State.selected = r.result.center || null;
    renderLeft(); fit();
    if (State.selected) selectNode(State.selected);
    return;
  }
  if (p.intent === 'path' && r.result) {
    const best = (r.result.paths || [])[0];
    if (best) { State.focus = new Set(best.path); fit(); renderLeft(); }
    State.panel = {tab: 'report', loading: false, data: {
      markdown: `*Interpreted as: ${p.interpretation}*\n\n` + r.result.markdown,
      pdf: `/api/path.pdf?a=${encodeURIComponent(p.params.a)}&b=${encodeURIComponent(p.params.b)}` +
           `&cutoff=${p.params.cutoff || 5}`, pdfLabel: 'Connection analysis (PDF)'}};
    renderRight(); return;
  }
  if (p.intent === 'anomalies') { State.panel = {tab: 'findings', loading: false}; renderRight(); return; }
  if (p.intent === 'influencers') {
    const rows = r.result.map(x => `| ${x.rank} | ${x.label} | ${x.score.toFixed(3)} | ${x.why} |`).join('\n');
    State.panel = {tab: 'report', loading: false, data: {markdown:
      `## Most influential individuals\n\n*Interpreted as: ${p.interpretation}*\n\n` +
      `| # | Name | Score | Why |\n|---|---|---|---|\n${rows}\n\nScores are a transparent ` +
      `weighted sum of betweenness, PageRank, degree, eigenvector centrality, prior record ` +
      `and cross-group bridging. No component is hidden.`}};
    renderRight(); return;
  }
  if (p.intent === 'transactions') {
    const rows = r.result.slice(0, 30).map(t => `| ${t.timestamp.slice(0, 10)} | ${t.from_name} | ` +
      `${t.to_name} | Rs ${(+t.amount_inr).toLocaleString('en-IN')} | ${t.mode} |`).join('\n');
    State.panel = {tab: 'report', loading: false, data: {markdown:
      `## Financial transactions\n\n*Interpreted as: ${p.interpretation}*\n\n` +
      `| Date | From | To | Amount | Mode |\n|---|---|---|---|---|\n${rows}`}};
    renderRight(); return;
  }
  if (p.intent === 'communities') {
    const txt = r.result.map((g, i) => `### Group ${i}\n` +
      g.map(n => `- ${State.nodes.get(n)?.label || n}`).join('\n')).join('\n\n');
    State.panel = {tab: 'report', loading: false,
      data: {markdown: `## Detected sub-groups\n\n*Interpreted as: ${p.interpretation}*\n\n${txt}`}};
    renderRight(); return;
  }
  if (p.intent === 'entity') return selectNode(p.params.node);
  State.panel = {tab: 'report', loading: false,
    data: {markdown: '```\n' + JSON.stringify(r.result, null, 2).slice(0, 4000) + '\n```'}};
  renderRight();
}

/* ======================= COMMAND PALETTE =======================
   One place to reach anything: subjects (including their Devanagari
   spellings), findings, views and the example questions. Without it a
   53-node graph means hunting for a label with the mouse.
   ============================================================== */
const palScrim = document.getElementById('palscrim');
const palq = document.getElementById('palq');
const palres = document.getElementById('palres');
let palItems = [], palSel = 0;

function palSource() {
  const items = VIEWS.map(([k, l]) => ({
    kind: 'view', tag: 'view', title: l, sub: 'Go to ' + l.toLowerCase(),
    icon: '▸', run: () => setView(k)}));
  for (const n of State.nodes.values()) {
    const alias = (n.aliases || []).join(' · ');
    items.push({kind: 'entity', tag: TYPE[n.type]?.label || n.type, title: n.label,
      sub: alias || (n.phones || []).join(', ') || '', hay: n.label + ' ' + alias,
      icon: n.type === 'PERSON' ? '●' : n.type === 'ORG' ? '■' : '▲',
      run: () => selectNode(n.id)});
  }
  for (const f of State.findings) {
    items.push({kind: 'finding', tag: f.severity, title: f.title,
      sub: (f.entity_labels || []).join(', '), icon: '!',
      run: () => { setView('graph'); State.panel = {tab: 'findings', loading: false};
                   renderRight(); if ((f.entities || [])[0]) selectNode(f.entities[0]); }});
  }
  for (const q of EXAMPLES)
    items.push({kind: 'query', tag: 'ask', title: q, sub: 'Run this question',
      icon: '?', run: () => runQuery(q)});
  return items;
}

function palFilter(q) {
  const all = palSource();
  if (!q.trim()) return all.filter(i => i.kind !== 'entity').slice(0, 12);
  const t = q.toLowerCase();
  const score = i => {
    const hay = ((i.hay || i.title) + ' ' + (i.sub || '')).toLowerCase();
    if (i.title.toLowerCase().startsWith(t)) return 0;
    if (hay.includes(t)) return 1;
    // subsequence match, so "vksethi" still finds Vikram Sethi
    let j = 0;
    for (const ch of hay) if (ch === t[j]) j++;
    return j === t.length ? 2 : 99;
  };
  return all.map(i => [score(i), i]).filter(x => x[0] < 99)
    .sort((a, b) => a[0] - b[0]).slice(0, 40).map(x => x[1]);
}

function palRender() {
  palres.innerHTML = palItems.length ? palItems.map((i, n) => `
    <div class="r ${n === palSel ? 'sel' : ''}" data-i="${n}">
      <span class="ic">${i.icon}</span>
      <span class="m">${esc(i.title)}${i.sub ? `<small>${esc(i.sub)}</small>` : ''}</span>
      <span class="tag">${esc(i.tag)}</span></div>`).join('')
    : '<div class="empty">No match. Try a name, a finding, or a question.</div>';
  palres.querySelectorAll('.r').forEach(r => {
    r.onclick = () => { palItems[+r.dataset.i].run(); closePal(); };
    r.onmouseenter = () => { palSel = +r.dataset.i; palRender(); };
  });
  const sel = palres.querySelector('.sel');
  if (sel) sel.scrollIntoView({block: 'nearest'});
}
function openPal() {
  palScrim.classList.add('on'); palq.value = ''; palSel = 0;
  palItems = palFilter(''); palRender(); palq.focus();
}
function closePal() { palScrim.classList.remove('on'); }
palq.oninput = () => { palItems = palFilter(palq.value); palSel = 0; palRender(); };
palq.onkeydown = e => {
  if (e.key === 'ArrowDown') { palSel = Math.min(palSel + 1, palItems.length - 1); palRender(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { palSel = Math.max(palSel - 1, 0); palRender(); e.preventDefault(); }
  if (e.key === 'Enter' && palItems[palSel]) { palItems[palSel].run(); closePal(); }
  if (e.key === 'Escape') closePal();
};
palScrim.onclick = e => { if (e.target === palScrim) closePal(); };
document.getElementById('cmdbtn').onclick = openPal;

/* --------------------------------------------------------- help */
const helpScrim = document.getElementById('helpscrim');
const SHORTCUTS = [
  ['⌘K / Ctrl K', 'Search everything'], ['1 – 7', 'Switch view'],
  ['/', 'Focus the question box'], ['T', 'Toggle light / dark'],
  ['F', 'Fit graph to view'], ['Esc', 'Clear selection or filter'],
  ['?', 'This panel'], ['Double-click', 'Isolate a 2-hop network'],
];
function openHelp() {
  document.getElementById('helpbox').innerHTML = `
    <h2>Getting around</h2>
    <p>Start on <b>Overview</b> for the case at a glance, then open <b>Network</b> to trace
       any figure back to the records behind it.</p>
    <div class="kgrid">${SHORTCUTS.map(([k, v]) =>
      `<div class="kr"><kbd>${k}</kbd><span>${v}</span></div>`).join('')}</div>
    <p style="margin-top:18px">Everything the system claims resolves to a source record.
       Click any link in a subject profile to read it.</p>`;
  helpScrim.classList.add('on');
}
helpScrim.onclick = e => { if (e.target === helpScrim) helpScrim.classList.remove('on'); };
document.getElementById('helpbtn').onclick = openHelp;

/* ----------------------------------------------------- keyboard */
addEventListener('keydown', e => {
  const typing = /input|textarea|select/i.test(e.target.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return openPal(); }
  if (e.key === 'Escape') {
    closePal(); helpScrim.classList.remove('on');
    if (State.focus || State.selected) { State.focus = null; State.selected = null;
      renderLeft(); renderRight(); draw(); }
    return;
  }
  if (typing) return;
  const n = VIEWS.findIndex(v => v[2] === e.key);
  if (n >= 0) return setView(VIEWS[n][0]);
  if (e.key === '/') { e.preventDefault();
    if (State.view !== 'graph') setView('graph');
    setTimeout(() => document.getElementById('nlq')?.focus(), 60); return; }
  if (e.key.toLowerCase() === 't')
    return setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  if (e.key.toLowerCase() === 'f' && State.view === 'graph') return fit();
  if (e.key === '?') openHelp();
});

/* ============================== BOOT ============================== */
async function boot() {
  renderNav();
  document.getElementById('theme').onclick = () =>
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  document.getElementById('role').onchange = e => { TOKEN = e.target.value; boot(); };
  try {
    State.me = await api('/api/me').catch(() => null);
    State.stats = await api('/api/stats');
    State.timeline = {...State.stats.timeline, playing: false};
    State.graph = await api('/api/graph');
    State.findings = await api('/api/findings').catch(() => []);
    State.dash = await api('/api/dashboard').catch(() => null);
  } catch (e) {
    document.getElementById('scroller').innerHTML =
      `<div class="dash"><div class="empty">Could not reach the API: ${esc(e.message)}</div></div>`;
    return;
  }
  const prev = State.nodes;
  State.nodes = new Map(State.graph.nodes.map(n => [n.id, {...n, ...(prev.get(n.id)
    ? {x: prev.get(n.id).x, y: prev.get(n.id).y} : {})}]));
  State.edges = State.graph.edges;
  if (!prev.size) layout(State.nodes, State.edges);

  document.getElementById('chip-a').innerHTML =
    `<b>${State.stats.entities_resolved}</b> subjects · <b>${State.stats.edges}</b> links`;
  document.getElementById('chip-b').innerHTML =
    `<b>${State.findings.filter(f => f.severity === 'high').length}</b> high-severity`;
  renderLeft(); renderRight();
  setView(State.view);
}
initTheme();
boot();
</script>
</body>
